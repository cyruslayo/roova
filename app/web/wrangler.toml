name = "roova-capture-stage"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-15"

[[d1_databases]]
binding = "DB"
database_name = "roova-capture-stage-db"
database_id = "d0a1bdd6-4b35-423e-bcae-584c5b573e87"
migrations_dir = "../api/migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "roova-capture-stage-media"

[vars]
AUTH_MODE = "access"
# Set these to the protected preview's Cloudflare Access application values.
# Until then the API denies all operator requests.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
